[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai/status"
  to = "/.netlify/functions/ai-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/generate-questions"
  to = "/.netlify/functions/ai-generate-questions"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/refine-question"
  to = "/.netlify/functions/ai-refine-question"
  status = 200
  force = true

[[redirects]]
  from = "/api/ai/parse-exam-document"
  to = "/.netlify/functions/ai-parse-exam-document"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
